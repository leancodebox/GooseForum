root = "."
tmp_dir = "storage/tmp"

[build]
bin = "./storage/tmp/GooseForum"
args_bin = ["serve"]
cmd = "go build -o ./storage/tmp/ ."
delay = 1000
exclude_dir = [
  ".git",
  ".idea",
  ".pnpm-store",
  "assets",
  "dist",
  "node_modules",
  "resource/apps",
  "resource/coverage",
  "resource/e2e",
  "resource/node_modules",
  "resource/packages",
  "resource/playwright-report",
  "resource/scripts",
  "resource/src",
  "resource/static/dist",
  "resource/test",
  "resource/test-results",
  "storage",
  "themes",
  "tmp",
  "tmp_refs",
  "vendor",
]
exclude_file = []
exclude_regex = ["_test\\.go$"]
exclude_unchanged = false
follow_symlink = false
full_bin = ""
include_dir = []
include_ext = ["go", "gohtml", "tpl", "tmpl", "html", "env", "toml"]
kill_delay = 1000000000
log = "build-errors.log"
send_interrupt = true
stop_on_error = true

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
time = true

[misc]
clean_on_exit = false
