name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  go:
    name: Go tests
    needs: resource
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download React assets
        uses: actions/download-artifact@v6
        with:
          name: react-assets
          path: resource/static/dist/react

      - name: Test Go with embedded React assets
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Vet Go packages
        run: go vet ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: go-coverage
          path: coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false

  database-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gooseforum
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d gooseforum"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify invitation concurrency on PostgreSQL
        env:
          GOOSEFORUM_POSTGRES_TEST_DSN: host=localhost user=postgres password=postgres dbname=gooseforum port=5432 sslmode=disable
        run: go test ./app/models/forum/invitations -run TestPostgresReservationAllowsOnlyOneWinner -count=3

  mysql-integration:
    name: MySQL integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gooseforum
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify invitation concurrency on MySQL
        env:
          GOOSEFORUM_MYSQL_TEST_DSN: root:root@tcp(localhost:3306)/gooseforum?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci
        run: go test ./app/models/forum/invitations -run TestMySQLReservationAllowsOnlyOneWinner -count=3

  resource:
    name: Resource build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          package_json_file: resource/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: resource/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: resource
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: resource
        run: pnpm build

      - name: Upload production assets for Go tests
        uses: actions/upload-artifact@v6
        with:
          name: react-assets
          path: resource/static/dist/react
          include-hidden-files: true

  react-quality:
    name: React quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          package_json_file: resource/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: resource/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: resource
        run: pnpm install --frozen-lockfile

      - name: Check documentation links
        working-directory: resource
        run: pnpm check:docs

      - name: Report production dependency vulnerabilities
        continue-on-error: true
        working-directory: resource
        run: pnpm audit:dependencies

      - name: Run React static, unit, dead-code, DOM, and bundle gates
        working-directory: resource
        run: pnpm check:react

      - name: Enforce React coverage floors
        working-directory: resource
        run: pnpm test:react:coverage

      - name: Install Chromium
        working-directory: resource
        run: pnpm exec playwright install --with-deps chromium

      - name: Run desktop and mobile smoke/accessibility tests
        working-directory: resource
        run: pnpm test:react:e2e

      - name: Upload React coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: react-coverage
          path: resource/coverage

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: resource/playwright-report
